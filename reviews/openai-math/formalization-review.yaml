    266 (weaker-statement) Exactly three mutually unbiased bases in dimension six: `MUB6.fourier_and_family_bound` states `(∀ H, IsHadamard H → ¬ Equivalent H tao → ∀ π, g H (permuteCharge π alpha) = 0) ∧ (∀ n, Attainable n → n ≤ 5)`: the Fourier-vanishing statement (the Matolcsi-Ruzsa-Weiner companion) and only the weak family bound `n ≤ 5` for mutually unbiased orthonormal bases of ℂ⁶ (`IsMUBFamily B := ∀ r ≠ s, ∀ i j, |⟨B r i, B s j⟩|² = 1/6`). Not stated: N(6) = 3, i.e. neither `Attainable 3` nor the exclusion of four bases (docs: 'does not establish the paper's upper bound of three or its computer-assisted exclusion of four'). `n ≤ 5` is the non-existence of 6 MUBs (with Weiner's gap theorem, not in Lean, this would give N(6) <= 4); the binary64 certificate for excluding four is outside the Lean statement. Cone is 2.83M lines of OAI, the largest in this range.
    267 (weaker-statement) Positive-temperature Bose--Einstein condensation and quantum depletion: `condensation_with_mixed : ∃ ε₀ c₀ > 0, ∀ a ρ, ρ a^3 < ε₀ → ∀ thermodynamic sequences (N_k, L_k), (∀ pure ground vectors Ψ_k, c₀ ≤ liminf occupation Ψ_k) ∧ (∀ density operators supported on the ground space, c₀ ≤ liminf mixedOccupation)` is ZERO-temperature ground-state condensation of the hard-sphere gas with a non-sharp lower bound c₀ (docs: 'concerns ground states, without a positive-temperature assertion'). The summary's headline claims are not stated: BEC for the exact canonical Gibbs state at a strictly positive volume-independent temperature, and the sharp Bogoliubov leading quantum-depletion law (thermodynamic limit before dilute limit) for hard spheres and bounded finite-range potentials.
    269 (partial) The Laughlin gap and stability under scalar disorder: Stated: the unperturbed spherical Laughlin gap at flux Q = 3(N-1): `Laughlin.MainTarget` (1/100) and `LaughlinGap.MainTarget` (`(1/25) * distanceToLaughlinSq ψ ≤ energy ψ` for every antisymmetric ψ and N >= N₀), the Fock-space inequality `thm_fock` (H² ≥ γ H for all γ < γ* ≈ 0.4617 and large flux, independent of particle number) and a planar version. Not stated: the summary's second claim, stability of the uniform gap and uniqueness of the ground state under weak bounded real scalar one-body potentials projected to the lowest Landau level (docs: 'Stability under projected one-body potentials and uniqueness of the perturbed ground state are outside it'); nor that `laughlinVector` is a zero-energy state (the inequality is stated against the line through it).
    271 (partial) Bloch's law and spontaneous ferromagnetic order: PRIMARY CLAIM NOT STATED (only a secondary result is formalized). Only `spontaneous_magnetization (d ℓ) (hd : 3 ≤ d) (hℓ : 1 ≤ ℓ) : DynamicsConverges d ℓ ∧ ∃ β₀ > 0, ∀ β ≥ β₀, ∃ ω, TranslationInvariant ω ∧ IsKMS β ω ∧ (ω.functional (spinZ d ℓ 0)).im = 0 ∧ ℓ/8 ≤ (ω.functional (spinZ d ℓ 0)).re` (nearest-neighbor Heisenberg ferromagnet, every spin S = ℓ/2) is stated, i.e. the summary's third claim. The headline, Bloch's T^{3/2} law with its exact coefficient for general finite-range couplings (and the first lattice correction for 3D nearest-neighbor couplings), has no Lean statement (docs: 'The formalization proves spontaneous magnetization ...').
    272 (partial) Entanglement without secret key and the PPT-square conjecture: PRIMARY CLAIM NOT STATED (only a secondary result is formalized). Stated: `DimensionTenChannel.exists_channel_fin21 : ∃ Θ : Map (Fin 21) (Fin 21), PPT Θ ∧ TracePreserving Θ ∧ ¬ EntanglementBreaking (Θ.comp Θ)` (the PPT-square counterexample with `PPT F := CP F ∧ CP (T ∘ F)` and `EntanglementBreaking` via separability of every amplification) and `DimensionTenPair.main_pair` (two explicit PPT maps on 10x10 matrices whose composition is not entanglement breaking and whose Choi matrix has no nonzero product vector in its range). Not stated: the summary's first claim, an entangled state on ℂ¹⁰⊗ℂ¹⁰ with zero distillable secret key under the specified local-instrument/authenticated-communication protocols (docs: 'outside these two selected Comparator statements').
    276 (partial) The classical capacity of generalized amplitude damping: Stated: `GAD.main`: for all γ, ν ∈ [0,1], `holevo γ ν n = n * holevo γ ν 1` (additivity across n uses of the same channel), `∃ p, Maximizes γ ν p ∧ holevo n = n / log 2 * objective γ ν p` (explicit one-variable optimization), `capacity γ ν = holevo γ ν 1` (operational capacity as sup of achievable rates with unrestricted collective decoding) and that every maximizing phase-pair product ensemble attains the block value. Not stated: the summary's additivity of Holevo capacity, minimum output entropy and regularized capacity when tensored with ANY finite-dimensional channel (docs: 'Additivity with an arbitrary different partner channel ... not included').
    280 (partial) Strong locality for strongly rational unitary vertex operator algebras: `MinimalVertex.main (hSimple : A.toVertexAlgebra.IsSimple) (hSR : A.IsStronglyRational) : A.PolynomialEnergyBounds ∧ CKLWStrongLocal U _ ∧ Nonempty (IrreducibleConformalNetStructure (intervalAlgebra U _))`: polynomial energy bounds, strong locality (`intervalAlgebra I ≤ (intervalAlgebra I.complement).commutant`) and an irreducible conformal net (isotony, locality, Möbius and Diff(S¹) covariance, unique vacuum, positive energy) for a simple unitary strongly rational VOA, i.e. the strong-locality core of the summary. Not stated: complete rationality of the net (the summary says it generates a COMPLETELY RATIONAL net), unitarizability of all simple modules, and the braided unitary tensor equivalence of Rep(V) with the net's finite-index sectors (docs: 'does not include complete rationality ... unitarizability ... the braided tensor equivalence').
    281 (supporting-only) QAOA optimality for the SK model: No QAOA statement exists. The challenges are `SKValue.value_consequences` (conditional on `IsMinimizer W γ` and a diffusion `X`: the finite-size SK ground-state energy per spin `groundStateSequence n` converges to `groundStateValue = parisi W γ`, with martingale/curvature-integral formulas and convergence of finite Gaussian coefficient sums) and `SKFullSupport.full_support` (full support of zero-temperature Parisi minimizers). Docs: 'it does not itself assert convergence of QAOA circuit energies', and 'does not separately assert existence of a minimizer'. The summary's headline (QAOA with finite depth and size/disorder-independent angles reaches the SK ground-state energy per spin, size before depth, plus MaxCut on random regular graphs) is absent.
    289 (partial) The strong Kadison--Kastler conjecture: Stated: `universal_strong_stability : ∀ ε > 0, ∃ δ > 0, ∀ H, ∀ von Neumann algebras M N on H (Mathlib `VonNeumannAlgebra`), kkDistance M N < δ → ∃ unitary v, v M v* = N ∧ ‖v - 1‖ < ε` with `kkDistance` the Hausdorff distance of the unit balls. Not stated: the summary's two counterexamples (near-identity conjugacy fails for one-sided near inclusions; arbitrarily close norm-separable C*-algebras need not be ambiently unitarily conjugate); the docs scope also only mentions the stability theorem although the docs title says 'spatial boundaries'.
    290 (supporting-only) Connes' bicentralizer conjecture and relative bicentralizers: Only a technical lemma is stated: `bounded_recovery (S : StandardModularData H) (hscalar : S.ScalarCentralizer) (omega free ultrafilter) (T) (s) (delta) ... (hpositive : 0 < limsup (fixedMean omega (fun t => ‖T (D.unitary t (h n))‖²))) : RecoveryConclusion S T s delta` (a subsequence of uniformly bounded algebra elements v_j with `eta ≤ ‖T (v_j ξ)‖` and spectral support in bands of 4x the width). The summary's headline, Connes' bicentralizer conjecture for every type III₁ factor with separable predual and every faithful normal state (and the relative bicentralizer statement producing an amenable P with P' ∩ c(M) = N' ∩ c(M)), is not stated (docs: 'The absolute bicentralizer conjecture is not included').
    291 (supporting-only) Toms--Winter and equivariant Jiang--Su stability: The single challenge is `CurrentMain.main : MainClaim`, i.e. `Statement` (for a simple separable nuclear stably finite infinite-dimensional C*-algebra with tracial states and a free ultrafilter U, if the uniform tracial ultrapower of the uniform tracial completion has real rank zero then `UniformPropertyGammaAt A U`), preceded by existential witnesses for the hand-built `NormConstruction`/`NullConstruction`/`CauchyConstruction`/`LimitConstruction`/`TraceConstruction` classes. This is a supporting technical implication (docs: 'real rank zero ... implies uniform property Γ'). The summary's headline results, equivariant Jiang-Su stability for every countable discrete amenable group action and the unital Toms-Winter conjecture (strict comparison ⇔ finite nuclear dimension ⇔ Jiang-Su stability), are not stated.
    299 (partial) The Kirchberg--R\o rdam character criterion: Stated: `character_criterion (A) [CStarAlgebra A] [Nontrivial A] [SeparableSpace A] (ω) (hω : ω ≤ cofinite) : HasNoCharacters (NormUltrapower.CentralAlgebra A ω) ↔ Nonempty (A ≃⋆ₐ[ℂ] MinTensor.Algebra A JiangSu.Algebra)` (for unital separable A: the relative commutant A_ω ∩ A' has no nonzero *-character iff A ≅ A ⊗_min 𝒵; for unital A the annihilator quotient is trivial). Not stated: the summary's second claim, that the infinite minimal tensor power of every such algebra without characters is Jiang-Su stable (the Dadarlat-Toms question; docs only mention the criterion).
    307 (partial) Failure of rational injectivity for maximal coarse assembly: `bounded_geometry_graph_counterexample_unconditional` gives finite connected bounded-degree graphs `fiberedGraph ... j` whose coarse union `VertexUnion` is proper, has uniformly finite balls and separation ≥ 1, and α ∈ `KX1 VertexUnion` of infinite order with `constructedCoarseAssembly α = 0`, `1 ⊗ α ≠ 0` and non-injectivity also after `⊗ ℚ`, but the target is K₁ of the *reduced* Roe algebra (`DiscreteRoe.algebra`; the file header says 'ordinary reduced coarse assembly map'). That is the summary's companion claim (the rational coarse Novikov counterexample); the headline failure for the *maximal* assembly map is strictly stronger (reduced = quotient ∘ maximal, so ker(max) ⊆ ker(reduced)) and has no statement. Title and summary say 'maximal' while docs, lean_scope and the Lean say 'reduced', and Lean wins.
    312 (supporting-only) The Grothendieck homotopy hypothesis: Only `elementary_expansion`: for a coherator C (Ara-Henry convention, encoded by hand), a cellular model X and a pushout of `J n : disk n → disk (n+1)` along any `disk n → X`, the inclusion X → Y is a `WeakEquivalence` (bijection on π₀ and on every π_n at every basepoint). The homotopy hypothesis itself (comparison of these ∞-groupoid models with spaces) is not stated; docs: 'the later semi-model structure and full comparison with the homotopy theory of spaces are not included'.
    323 (partial) Relative independence of the separable quotient problem: `negative_main (hCH : CH) : ¬ SQ.{u} ℝ ∧ ¬ SQ.{u} ℂ` (CH := `Cardinal.mk ℝ = aleph 1`; `SQ` = every complete infinite-dimensional normed space has a bounded linear surjection onto an infinite-dimensional separable Banach space) is the continuum-hypothesis counterexample half over both fields. The other half of the independence claim, consistency of the positive assertion relative to a measurable cardinal, has no statement (docs: 'the positive consistency direction ... outside the selected statement').
    337 (partial) Cartan--Hadamard isoperimetry and CAT$(0)$ fillings: `sharp_integral_filling` (every compactly supported integral n-cycle, n ≥ 2, in a proper CAT(0) space has a compactly supported integral filling of mass ≤ C_n·mass^((n+1)/n)) and `coefficient_optimal` (Euclidean sharpness) cover the summary's second claim only. The headline, the sharp Cartan-Hadamard isoperimetric inequality for finite-perimeter sets in complete simply connected manifolds with curvature ≤ κ ≤ 0 (and the Euclidean-ball equality case for κ = 0), has no statement; the docs concede only 'the selected integral-current form' is proved, and the Lean form does not imply the set-based inequality.
    347 (partial) Counterexamples to strong forms of Arnold's fixed-point conjecture: `main` gives only the second claim: a Hamiltonian diffeomorphism φ of the quadric Q³ ⊂ ℂP⁴ with exactly 3 fixed points (one provably degenerate) while every smooth function has ≥ 4 critical points (`4 ≤ criticalNumber`). The headline nondegenerate stable-Morse counterexample on 22-dimensional Kähler manifolds with unbounded deficit has no statement (docs: 'the separate nondegenerate Morse-number construction is not included').
    348 (partial) Nonnegatively curved Einstein four-manifolds and a topological gap: The Lean classification assumes strictly positive sectional curvature (`HasPositiveSectionalCurvature`) and concludes scaled isometry to round S⁴, Fubini-Study ℂP² or round ℝP⁴ (oriented case: S⁴ or ℂP²). That is a special case of the summary's nonnegative-curvature classification (which also has the S²×S² product); the L² trace-free-Ricci topological gap theorem is not stated.
    350 (partial) Yau's nodal conjecture: surfaces and counterexamples: `NodalLength.Main` is the headline: on every compact connected smooth Riemannian surface there is C with H¹(nodal set) ≤ C√λ for every nonzero smooth eigenfunction with -Δu = λu, λ > 0; `sphere_three` (every C^∞ neighbourhood of the round S³ metric contains a metric with unbounded nodal ratio) and `sphere_two_torus_two` give dimensions 3 and 4. For dimension five, YauCounterexample (S⁴×S¹) only gives H⁴(nodal)/√λ → ∞, not the summary's power-law growth λ^(1/2+ε₀), so that claim is only stated in a weaker form.
    353 (partial) The sharp dimension threshold for affine Bernstein rigidity: `affine_bernstein` (3 ≤ n ≤ 9): a smooth function with positive-definite Hessian on a nonempty open convex Ω solving the affine-maximal equation with graph complete for the induced Euclidean path metric forces Ω = ℝⁿ, u a positive-definite quadratic plus affine term, and the graph an affine image of the standard paraboloid. The sharpness claim (smooth entire nonquadratic example in dimension ten) and the extension to hypersurfaces complete for the affine Berwald-Blaschke metric have no statement (docs: immersed extension outside the statement).
    356 (supporting-only) Gigli's characterization of Alexandrov curvature: Only `every_geodesic`: in a complete separable RCD(K,N) space (N > 1, full-support reference measure finite on bounded sets), a bounded Lipschitz F whose weak Hessian is ≤ G·metric (G bounded continuous) satisfies the distributional bound (F∘σ)'' ≤ G(σ)·d(σ(0),σ(1))² along every constant-speed geodesic. Gigli's conjecture (Alexandrov curvature ≥ κ ⇔ RCD((n-1)κ,n) with H^n and distributional sectional curvature ≥ κ) is not stated.
    359 (partial) Negative K\"ahler curvature without bounded holomorphic coordinates: `main_theorem` gives a nonempty open contractible M ⊆ ℂ³ with a smooth Kähler metric that is geodesically complete (all geodesics extend for all time) and negatively pinched (-B ≤ sectional ≤ -A < 0), with no bounded holomorphic map with everywhere-nonvanishing Jacobian and no biholomorphism onto a bounded domain; `controlled_potential` and `metric_transfer` support it. The summary's second claim (a higher-dimensional example with sectional curvature ≤ -1, only constant bounded holomorphic functions, curvature not bounded below) is not stated.
    361 (weaker-statement) Counterexamples to Yau's harmonic dimension bound: `MainClaim` is ∃ n (even, ≥ 8), k ≥ 2 and one complete smooth metric on ℝⁿ with Ric ≥ 0, Euclidean near 0, asymptotic volume ratio in (0,1), and euclideanDimension n k + 1 independent harmonic functions of growth ≤ k: a single higher-dimensional counterexample, as the docs say. The summary's claim (complete metrics on ℝ³ with ≥ (k+2)² harmonic functions of growth ≤ k for every sufficiently large integer k) is not implied. The challenge file also contains `axiom mainStatement : MainClaim` and `theorem main := mainStatement` instead of `sorry`, a non-standard stub shape; no `axiom` exists in the solution cone.
    363 (weaker-statement) Boltzmann nonuniqueness with exact local conservation: `nonuniqueness` gives bounded-velocity-support data f₀ and two `AdmissibleGlobal` renormalized solutions F, G (all renormalizations β, gain/loss integrability, weak continuity, local mass conservation as a weak identity, global momentum conservation, global energy inequality ≤ and entropy-dissipation inequality) that are strongly L¹-continuous with integrable gain/loss on a common [0,T] only and differ at some t ≤ T. The summary's exact local conservation of momentum and kinetic energy, and strong L¹ continuity for all times, are not stated (docs: 'later local-conservation refinements are outside it').
    365 (partial) Joint metric and connection recovery from one boundary patch: `main_nonuniqueness` covers only the contrast claim: on the ball B(0,3) ⊂ ℝ³ there are two bounded measurable conductivities in [c, C], both equal to 1 near the boundary, differing on a positive-measure set, with one and the same weak Dirichlet-to-Neumann operator Λ (`IsDirichletToNeumann`: for every trace a unique harmonic H¹ extension with Λ f (trace v) = ∫γ∇u·∇v). The summary's first-named result, recovery of a smooth metric and unitary connection on a rank-two Hermitian bundle over manifolds of dimension ≥ 3 from zero-frequency data on one boundary patch (up to diffeomorphism and gauge), has no statement; the docs scope also only describes the conductivity result.
    367 (partial) The critical dimension for the one-phase Bernoulli problem: `nonflat_in_seven`: there is u : ℝ⁷ → ℝ that is a nonnegative global minimizer of ∫ |∇u|² + 1_{u>0} (ballwise comparison with H¹ competitors agreeing on the boundary, all balls), nonzero, 1-homogeneous and not a half-space solution max(x·e,0): the existence half of 'seven is the first dimension'. The other half (flatness of such minimizers in dimensions ≤ 6) and the consequences (smooth free boundaries through dimension six, singular set dimension ≤ n-7) are not stated (docs: 'outside this selected statement').
    373 (partial) Nonattainment in three-marginal Coulomb transport: `coulomb_counterexample_and_equal_infima`: there is a smooth compactly supported probability density ρ on ℝ³ (with smooth compactly supported √ρ) whose three-marginal Kantorovich problem for the cost Σ 1/|x_i-x_j| with identical marginals has finite value attained by some coupling, no pair of measurable measure-preserving maps (T₂,T₃) attains it, yet the Monge infimum equals the Kantorovich value and finite-cost Monge maps approach it. The summary's extension to every inverse-power Riesz exponent in each dimension ≥ 2 is not stated (docs: 'outside this statement').
review:
  status: independent third-party review — pre-referee
  reviewers:
  - MathVet (github.com/mathvet); no author of the reviewed formalization took part
  notes: 'Statement fidelity only: whether each Comparator challenge statement states its family''s headline claim.
    Proof correctness is left to Lean/Comparator; the truth of unformalized claims is not assessed. Published 2026-10-08.
    Error-rate protocol: 40 families (12 documented divergences with certainty, 14 drawn from the other non-full
    families, 14 drawn from the full families; seeded draw, sample.txt and its SHA-256 committed before any re-reading),
    two named referees who read Lean classify independently under the same rubric, a third adjudicates; the stratum-weighted
    error rate with its 80% Wilson interval is published whatever it is (target 2026-10-29). Lines fixed in advance:
    PASS at or below 0.10, KILL at or above 0.20, RETEST in between (+20 families). See PROTOCOL.md.'
