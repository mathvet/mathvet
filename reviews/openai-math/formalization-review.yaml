related_formalizations:
- id: https://github.com/openai/math
  relationship: other
  note: the reviewed formalization
status:
  scope: 'Review coverage: all 235 families of https://github.com/openai/math that have a lean/docs page and all
    405 Comparator challenges at commit adc7f1241b42e322a6451854ab7e4b4c146bf78a; 137 families have no Lean and
    are out of scope. Verdicts: full 144, partial 60, weaker-statement 19, supporting-only 12. Reviewer''s machine
    checks: 11 solutions built locally, 11 with a clean closure comparison and standard axioms, 5 accepted by the
    real Comparator, of which 4 on an isolated Linux VM with the real landrun (Landlock) sandbox. This repository
    proves nothing itself.'
automation:
  methods:
  - method: agent
    models:
    - Claude (Anthropic) models run in Claude Code, 2026-10-06 to 2026-10-07
    framework: Claude Code
    tool_setup: One agent pass per family reading the overview summary, lean/docs/NNN.md, every linked ComparatorChallenges/*.lean
      statement and the definitions it depends on; the verdict policy is fixed in advance (PROTOCOL.md); output
      validated mechanically against the catalogue (titles, challenge sets, cones). The maintainer re-read six families
      by hand and rebuilt the listed challenges with the checker in checker/.
    cost:
      wall_time: about one day
      spend_usd: subscription-based usage
      hardware: one M1 laptop, 16 GB
  notes: No second human reader yet; the labels are one model-assisted pass. The referee protocol that measures
    their error rate is pre-registered in PROTOCOL.md.
fidelity:
  divergences: |
    MathVet reading, pre-referee, one entry per family whose Lean statements do not state the family headline in full (class in parentheses: partial | weaker-statement | supporting-only). The lab's own scope note for each family is lean/docs/NNN.md at the reviewed commit and is quoted verbatim in fidelity-table.json (field lab_scope_note).
    009 (partial) Bogomolov--Pop and Milnor $K$-theoretic reconstruction: Only injectivity half of Bogomolov-Pop reconstruction (Galois data side); no existence/surjectivity and no Milnor K-theoretic reconstruction or perfect-closure/constants recovery statement.
    015 (partial) Torus-packet equidistribution in prime, quartic, and sextic degrees: Prime degree >= 5 only; the primitive quartic (Picard packets) and primitive sextic (maximal-order ideal-class packets) results of the summary are not stated.
    033 (supporting-only) Campana's orbifold Iitaka conjecture and logarithmic subadditivity: Only the very-general negative-fibre (kappa(F) = -infinity) branch of log additivity in the projective reduced-SNC stratum-smooth setting; no Campana orbifold Iitaka statement, no Popa/variation inequality, no kappa >= 0 branch.
    039 (partial) Nagata's conjecture and maximal Seshadri constants: Nagata (r >= 10, very general, arbitrary multiplicities) fully stated; maximal multipoint Seshadri constants only for smooth projective surfaces over C, not (L^n/r)^{1/n} in dimension n >= 2 and not over algebraically closed fields of positive characteristic.
    047 (partial) Complex counterexamples to cancellation and affine fibrations: Cancellation counterexample (dimension four) fully stated; the Dolgachev-Weisfeiler affine-fibration counterexamples (smooth surjections with every fibre A^3, not Zariski-locally trivial) are not stated.
    049 (partial) A stable-coordinate counterexample in four variables: Stable-coordinate counterexample (family headline, Oct-5 paper: not a coordinate in 4 variables but a coordinate after adding one variable) is not stated; challenges cover only the Sept-24 paper: classical Abhyankar-Sathaye counterexample for the zero fibre (n >= 4) and commuting LNDs; 'every fibre is A^3' not stated.
    058 (supporting-only) The Koll\'ar--Pardon universal-cover conjecture: Only the bounded-domain symmetry lemma (companion paper); the Kollar-Pardon classification of semialgebraic universal covers D x C^m x F, the quasi-projective criterion and the 'covered by C^n => finite etale abelian cover' corollary are not stated.
    076 (weaker-statement) Ultraflat real Littlewood polynomials: Only max-modulus <= (1+eta)sqrt(N) and L^p (finite p) flatness are stated; uniform ultraflatness (two-sided, sup norm), merit factor -> infinity and the disproof of Turyn's conjecture are not. Two of the three index papers (Oct 5) are not linked in docs.
    082 (partial) Maximal and variational bounds for the triangular Hilbert transform: Maximal L^3 x L^3 -> L^{3/2} bound only; annular r-variation (r > 2), a.e./norm convergence and the trilinear symmetric-point estimate are not stated.
    084 (partial) The geometric case of the Erd\H{o}s similarity conjecture: Only q = 1/2 (dyadic) is stated; the geometric-progression case for every ratio q in (0,1) is not.
    088 (partial) Petty's projection-volume conjecture and simplex counterexamples: Petty (n >= 4, with ellipsoid equality case) fully stated; the product-of-simplices counterexample is stated only in dimension 20 (ratio 1.015...), not the exponential factor in every sufficiently large dimension; the full Lutwak-Petty inequality family is not stated.
    090 (partial) Universal optimality of the triangular lattice: Universal minimality of the triangular lattice for lower-limit energy per particle is stated; the renormalized Riesz (0<s<2) and Coulomb minimality, the Sandier-Serfaty and Brauchart-Hardin-Saff (spherical log energy) claims are not.
    091 (partial) The logarithmic Brunn--Minkowski conjecture: Only the Lebesgue-volume log-Brunn-Minkowski inequality; the scalar-dilation B-conjecture for even log-concave measures and the L_p Brunn-Minkowski inequality for 0<p<1 are not stated.
    095 (weaker-statement) Hyperbolicity cones without semidefinite lifts: Only the generalized Lax disproof (cone is not spectrahedral, no auxiliary variables); the Projected Lax disproof (not a spectrahedral shadow, no lift at all) is not stated, and the companion paper shows the formalized cone does have an exact semidefinite lift.
    104 (weaker-statement) Quasipolynomial algorithms for mean-payoff, stochastic and parity games: Only a randomized (error 1/8) quasipolynomial algorithm for the winning set; the deterministic algorithm, exact values/optimal positional strategies, turn-based stochastic games and mean-payoff-parity games (two of four index papers) are not stated. TruffetCounterexample is a side negative result.
    114 (partial) Approximate counting of common integer polymatroid bases: Matroid special case only (independence oracles, equal ranks); the integer-polymatroid FPRAS with binary capacities and rank-value oracles, and the variants for common independent sets of other cardinalities/unequal ranks, are not stated.
    116 (partial) Uniform identity testing for noncommutative formulas: Characteristic-zero existence of one hitting tuple (no complexity claim) and the poly-time rational hitting lists are stated; positive-characteristic constructions and the polynomial-bit-time bound for the single tuple are not.
    117 (partial) Uniform sparsest cut: hardness and semidefinite gaps: Only the Goemans-Linial integrality gap (real capacities, along a sequence of n); the NP-hardness of constant-factor approximation (the summary's first claim) is not stated.
    119 (partial) The Courtade--Kumar and Hellinger conjectures: Courtade-Kumar (with attainment) and the soft/biased-Boolean mutual-information contraction are stated; the Hellinger conjecture is not.
    122 (partial) Superpolynomial lower bounds and quasipolynomial reconstruction from deletion traces: Only the lower bounds (superpolynomial and n^{c log(q^3 log n)}) are stated; the quasipolynomial uniform decoder and the polynomial small-deletion-probability regime are not.
    126 (weaker-statement) Exponential semidefinite complexity of perfect matching: Superpolynomial (n^C for every C) lower bounds for exact affine SDP lifts and the unshifted PSD rank only; exponential size and the fixed-shift (0<rho<1) PSD-rank statements are not stated (superpolynomial still answers Rothvoss' polynomial-size question).
    130 (weaker-statement) Fourier transforms below $n\log n$: Existence of exact DFT circuits with < c n log2 n gates for infinitely many n (every c > 0) only; no O(n (log n)^{1-delta}) bound for every n, no explicit delta, and the non-uniform circuit model charges nothing for preparing the scalars (the summary's model counts scalar preparation and indexing).
    132 (weaker-statement) A counterexample to the quadratic sensitivity conjecture: Unbounded ratio bs/s^2 only; the fixed exponent alpha > 2 (bs >= s^alpha) of the summary is not stated in the challenge even though the docs claim it.
    143 (partial) Uniform limit-cycle bounds in Hilbert's sixteenth problem: Only the quintic Lienard system x' = y - F(x), y' = -x (at most 2 limit cycles, exactly 2 attained); the general uniform boundedness theorem for planar polynomial vector fields of degree n is not stated.
