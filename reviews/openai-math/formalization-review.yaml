      time $n^{2/3+o(1)}$ at $\beta=1$, and stretched-exponential mixing from a Gibbs-sampled fixed starting configuration
      for $\beta>1$, in probability over disorder. At criticality, rescaled stationary and quench autocorrelation
      processes have universal random limits for Gaussian and Rademacher disorder; the quench limit relaxes to the
      stationary limit.'
