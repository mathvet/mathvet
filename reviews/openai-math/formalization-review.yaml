  - family: '376'
    title: Universal computation in forced Navier--Stokes flows
    subject: Partial differential equations
    verdict: full
    challenges:
    - BalancedBoxRouting
    - BalancedThreeStack
    - ForcedNavierStokesComputation
    - NavierStokesAlternating
    - NavierStokesVelocity
    - SolenoidalSheetPrograms
    review_note: '`NavierStokesAlternating.alternating` (fixed computable ν > 0) gives computable compilers (Machine
      × input ↦ triple of `Nat.Partrec.Code` programs returning approximations, moduli and rapid-decay bounds) and,
      for every well-formed Turing machine and input, a smooth force f = residual ν U supported in one compact K,
      with U the unique energy-class solution from rest (zero pressure), such that the machine halts iff the particle
      started at (-1,0,0) reaches {x₁ > 0}. ForcedNavierStokesComputation and BalancedThreeStack (one theorem stated
      twice: all ν > 0, particle from (4,0,0) into (-1,2)³) and NavierStokesVelocity (torus and ℝ²×𝕋 detection)
      are variants. The forcing is not unconstrained: it must be uniformly computable in (M, w) (`ProgramFor`/`EffectiveFamily`/`Represents`),
      which excludes a force that already knows the halting answer.'
    definitions_to_check:
    - 'The flow is prescribed and the force is derived from it: `f = residual ν U := ∂ₜU + U·∇U - νΔU` (Alternating)
      or `f₀ := inertialCoefficient U`, `f₁ := viscousCoefficient U`, `affineForce f₀ f₁ ν` with pressure ≡ 0 (Forced/BalancedThreeStack);
      legitimate for forced Navier-Stokes since solutions are shown unique in an energy comparison class, but it
      means the force is only constrained through smoothness, compact support, computability and uniqueness'
    - 'NavierStokesVelocity: `def compile (B) (M) (w) : Program b N := ⟨B, M, w⟩` is trivial packaging; the effectiveness
      is carried by the fixed interpreter `evaluate := Nat.rfindOpt (valueTrial ..)` and the clause `Represents`,
      i.e. ''terminating compiler'' there means the interpreter always halts with an ε-approximation (the genuinely
      computable compiler is `Computable compileForce` in NavierStokesAlternating)'
    - 'Three different machine models: `Machine := ℕ × ℕ × ℕ × List ℕ × List (Option Rule)` (Alternating), `FiniteMachine`
      with `Option Transition` (Forced/BalancedThreeStack), Mathlib `Turing.TM0.Machine` (Velocity), and ''halts''
      is `∃ n, isHalting (run n)`, `Halts` (reachable configuration without a transition) and `(TM0.eval M w).Dom`
      respectively; BalancedThreeStack and ForcedNavierStokesComputation share the theorem name `OAI.BalancedTransport.balanced_three_stack_realization`
      and differ only by a `Fintype Direction` instance'
