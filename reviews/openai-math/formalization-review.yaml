      with priority for resolving the threshold-existence conjecture in her concurrent \href{https://eccc.weizmann.ac.il/report/2026/229/}{ECCC
      TR26-229}, made public October 5, 2026; this family supplies another proof and the sharper variance and computability
      results.'
