  - source: 'family 114 — headline claim as stated in the overview: Gives a fully polynomial randomized approximation
      scheme for counting common integer bases of two integral polymatroids of equal total rank, supplied by exact
      rank-value oracles. Capacities are binary-encoded, each integer vector counts once, and oracle calls and bit
      operations outside the oracles are polynomial on every execution. For matroids presented by independence oracles,
